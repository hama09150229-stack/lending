<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金銭管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0d0d0d; color: #f0f0f0; min-height: 100vh; }

  #screen-top { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; gap: 32px; }
  .top-title { font-size: 13px; letter-spacing: 4px; color: #555; text-transform: uppercase; }
  .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  .btn-primary { background: #e8c84a; color: #0d0d0d; border: none; border-radius: 8px; padding: 16px; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
  .btn-primary:active { opacity: 0.8; }
  .btn-secondary { background: transparent; color: #555; border: 1px solid #2a2a2a; border-radius: 8px; padding: 14px; font-size: 13px; cursor: pointer; letter-spacing: 1px; }

  .screen { display: none; min-height: 100vh; padding: 24px 20px 80px; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; }
  .screen-header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .back-btn { background: none; border: none; color: #e8c84a; font-size: 22px; cursor: pointer; }
  .screen-title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }

  .login-wrap { display: flex; flex-direction: column; gap: 20px; margin-top: 60px; }
  .login-label { font-size: 12px; color: #555; letter-spacing: 2px; margin-bottom: 6px; }
  .input-field { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 14px 16px; color: #f0f0f0; font-size: 16px; outline: none; }
  .input-field:focus { border-color: #e8c84a; }
  .error-msg { color: #e84a4a; font-size: 12px; margin-top: -10px; }
  .select-field { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 14px 16px; color: #f0f0f0; font-size: 15px; outline: none; appearance: none; }

  .detail-hero { text-align: center; padding: 40px 0 24px; }
  .detail-name { font-size: 13px; color: #555; letter-spacing: 3px; margin-bottom: 16px; }
  .detail-amount { font-size: 56px; font-weight: 800; color: #e8c84a; letter-spacing: -2px; }
  .detail-amount span { font-size: 20px; font-weight: 400; color: #888; }
  .detail-note { margin-top: 8px; font-size: 12px; color: #444; }

  .game-progress { margin: 24px 0 0; padding: 16px; background: #141414; border-radius: 12px; border: 1px solid #222; }
  .progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .progress-label-text { font-size: 11px; color: #555; letter-spacing: 2px; }
  .progress-label-amount { font-size: 13px; font-weight: 700; color: #888; }
  .progress-bar-bg { background: #1e1e1e; border-radius: 99px; height: 8px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #e8c84a, #f0a020); transition: width 0.6s ease; }

  .history-section { margin-top: 24px; }
  .history-title { font-size: 11px; color: #444; letter-spacing: 2px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #1e1e1e; }
  .history-item { border-bottom: 1px solid #181818; }
  .history-item-header { padding: 12px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; cursor: pointer; }
  .history-item-body { display: none; padding: 8px 0 12px; }
  .history-item-body.open { display: block; }
  .history-meta { font-size: 11px; color: #444; margin-bottom: 2px; }
  .history-name-tag { font-size: 12px; color: #666; font-weight: 600; }
  .history-empty { font-size: 13px; color: #333; text-align: center; padding: 24px 0; }

  .admin-total { font-size: 13px; color: #e8c84a; font-weight: 700; }
  .admin-person-row { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .admin-person-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .admin-person-name { font-size: 15px; font-weight: 700; }
  .delete-btn { background: none; border: none; color: #444; font-size: 18px; cursor: pointer; }
  .admin-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field-wrap label { display: block; font-size: 10px; color: #555; letter-spacing: 1px; margin-bottom: 4px; }
  .input-small { width: 100%; background: #111; border: 1px solid #2a2a2a; border-radius: 6px; padding: 8px 10px; color: #f0f0f0; font-size: 14px; outline: none; }
  .input-small:focus { border-color: #e8c84a; }
  .save-row-btn { margin-top: 10px; width: 100%; background: #1e1e1e; border: 1px solid #333; border-radius: 6px; color: #e8c84a; font-size: 13px; font-weight: 700; padding: 9px; cursor: pointer; }
  .add-person-wrap { margin-top: 20px; border-top: 1px solid #1e1e1e; padding-top: 20px; }
  .add-person-title { font-size: 11px; color: #444; letter-spacing: 2px; margin-bottom: 12px; }
  .add-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .btn-add { width: 100%; background: #e8c84a; color: #0d0d0d; border: none; border-radius: 8px; padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; }

  /* GAME OVERLAY */
  .game-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.97); flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 20px; padding: 32px; display: flex; }
  .game-overlay.hidden { display: none !important; }
  .game-title { font-size: 11px; letter-spacing: 4px; color: #555; }
  .game-result { font-size: 26px; font-weight: 900; letter-spacing: 2px; text-align: center; min-height: 36px; }
  .game-result.win { color: #e8c84a; }
  .game-result.lose { color: #444; }
  .game-sub { font-size: 13px; color: #555; text-align: center; min-height: 48px; }
  .game-action-btn { background: #e8c84a; color: #0d0d0d; border: none; border-radius: 8px; padding: 14px 40px; font-size: 15px; font-weight: 800; cursor: pointer; }
  .game-next-btn { background: #1a1a1a; border: 1px solid #333; color: #888; border-radius: 8px; padding: 12px 32px; font-size: 14px; cursor: pointer; }

  /* SLOT */
  .slot-machine { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .slot-reel { width: 72px; height: 80px; background: #111; border: 2px solid #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 38px; }
  .slot-reel.spinning { animation: slotBounce 0.1s linear infinite; }
  @keyframes slotBounce { 0%{transform:translateY(0)} 50%{transform:translateY(-6px)} 100%{transform:translateY(0)} }
  .slot-reel.win-reel { border-color: #e8c84a; box-shadow: 0 0 20px #e8c84a66; }

  /* AMIDA */
  .amida-wrap { width: 100%; max-width: 300px; }
  .amida-start-btns { display: flex; justify-content: space-around; margin-bottom: 8px; }
  .amida-btn { background: #1a1a1a; border: 2px solid #333; color: #f0f0f0; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 700; cursor: pointer; width: 52px; text-align: center; }
  .amida-btn.selected { border-color: #e8c84a; color: #e8c84a; }
  .amida-btn:disabled { opacity: 0.4; cursor: default; }
  .amida-canvas { display: block; margin: 0 auto; }
  .amida-goals { display: flex; justify-content: space-around; margin-top: 8px; }
  .amida-goal { width: 52px; text-align: center; font-size: 20px; }

  /* WHEEL */
  .wheel-wrap { position: relative; width: 220px; height: 220px; }
  .wheel-canvas { border-radius: 50%; display: block; }
  .wheel-needle { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 28px; line-height: 1; }

  /* JANKEN */
  .janken-choices { display: flex; gap: 16px; justify-content: center; }
  .janken-btn { background: #1a1a1a; border: 2px solid #333; border-radius: 12px; padding: 16px; font-size: 40px; cursor: pointer; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
  .janken-btn:active { border-color: #e8c84a; }
  .janken-btn:disabled { opacity: 0.3; cursor: default; }

  /* ZAWA */
  .zawa-overlay { position: fixed; inset: 0; background: #000; z-index: 200; }
  .zawa-overlay.hidden { display: none; }
  .zawa-overlay.flash { animation: zawaFlash 0.15s linear infinite; }
  @keyframes zawaFlash { 0%{background:#000} 49%{background:#000} 50%{background:#fff} 99%{background:#fff} 100%{background:#000} }
  .zawa-overlay.shake { animation: zawaShake 0.1s linear infinite; }
  @keyframes zawaShake { 0%{transform:translate(0,0)} 25%{transform:translate(-4px,3px)} 50%{transform:translate(3px,-4px)} 75%{transform:translate(-3px,-3px)} 100%{transform:translate(0,0)} }
  .zawa-overlay.flash.shake { animation: zawaFlash 0.15s linear infinite, zawaShake 0.1s linear infinite; }
  .zawa-text { position: absolute; font-weight: 900; font-family: "Hiragino Kaku Gothic ProN", sans-serif; opacity: 0; animation: zawaFade 1.2s ease-in-out forwards; pointer-events: none; }
  .zawa-overlay.flash .zawa-text { color: #000; }
  .zawa-overlay:not(.flash) .zawa-text { color: #fff; }
  @keyframes zawaFade { 0%{opacity:0;transform:scale(0.8)} 30%{opacity:1;transform:scale(1)} 70%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.1)} }

  /* 流れるアナウンス */
  .ticker-wrap { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(13,13,13,0.92); border-bottom: 1px solid #2a2a2a; height: 32px; overflow: hidden; }
  .ticker-wrap.hidden { display: none; }
  .ticker-inner { display: flex; align-items: center; height: 100%; white-space: nowrap; animation: tickerScroll linear infinite; }
  .ticker-inner:hover { animation-play-state: paused; }
  @keyframes tickerScroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
  .ticker-item { font-size: 11px; color: #e8c84a; margin-right: 48px; letter-spacing: 0.5px; }

  .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: #e8c84a; color: #0d0d0d; padding: 10px 22px; border-radius: 20px; font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap; z-index: 999; }
  .toast.show { opacity: 1; }
  .win-badge { display: inline-block; background: #e8c84a; color: #0d0d0d; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
  .chevron { font-size: 10px; color: #444; transition: transform 0.2s; }
  .chevron.open { transform: rotate(90deg); }
  .hist-tab { flex-shrink: 0; background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .hist-tab.active { background: #e8c84a; color: #0d0d0d; border-color: #e8c84a; }
</style>
</head>
<body>

<div id="screen-top">
  <div class="top-title">💴 金銭管理</div>
  <div class="btn-group">
    <button class="btn-primary" onclick="goUserSelect()">残高を確認する</button>
    <button class="btn-secondary" onclick="goAdminLogin()">管理画面</button>
  </div>
</div>

<div id="screen-user-login" class="screen">
  <div class="screen-header"><button class="back-btn" onclick="goTop()">‹</button><div class="screen-title">残高確認</div></div>
  <div class="login-wrap">
    <div><div class="login-label">名前を選ぶ</div><select class="select-field" id="user-select"><option value="">-- 選択 --</option></select></div>
    <div><div class="login-label">パスワード</div><input class="input-field" type="password" id="user-pw" placeholder="••••" inputmode="numeric"></div>
    <div class="error-msg" id="user-error"></div>
    <button class="btn-primary" onclick="userLogin()">確認する</button>
  </div>
</div>

<div id="screen-user-detail" class="screen" style="padding-top:56px;">
  <div class="screen-header"><button class="back-btn" onclick="goUserSelect()">‹</button><div class="screen-title">残高</div></div>
  <div class="detail-hero">
    <div class="detail-name" id="detail-name">NAME</div>
    <div class="detail-amount" id="detail-amount">0<span>円</span></div>
    <div class="detail-note">貸し出し残高</div>
  </div>
  <div class="game-progress">
    <div class="progress-label">
      <div class="progress-label-text">🎮 NEXT GAME</div>
      <div class="progress-label-amount" id="progress-amount-label">0 / 2,000円</div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>
  </div>
  <div id="user-game-btn-wrap" style="margin-top:16px;display:none;">
    <button class="btn-primary" id="user-game-btn" onclick="userStartGame()">🎟️ ゲームする</button>
    <div style="text-align:center;margin-top:6px;font-size:12px;color:#555;" id="user-ticket-count"></div>
  </div>
  <div style="margin-top:12px;">
    <button class="btn-secondary" style="width:100%;" onclick="goStampScreen()">🎫 スタンプカードへ</button>
  </div>
  <div class="history-section"><div class="history-title">履歴</div><div id="user-history-list"></div></div>
</div>

<div id="screen-admin-login" class="screen">
  <div class="screen-header"><button class="back-btn" onclick="goTop()">‹</button><div class="screen-title">管理画面ログイン</div></div>
  <div class="login-wrap">
    <div><div class="login-label">パスワード</div><input class="input-field" type="password" id="admin-pw" placeholder="••••" inputmode="numeric" onkeydown="if(event.key==='Enter')adminLogin()"></div>
    <div class="error-msg" id="admin-error"></div>
    <button class="btn-primary" onclick="adminLogin()">ログイン</button>
  </div>
</div>

<div id="screen-admin" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="goTop()">‹</button>
    <div class="screen-title">管理画面</div>
    <div class="admin-total" id="admin-total-display"></div>
  </div>
  <div id="admin-list"></div>
  <div class="add-person-wrap">
    <div class="add-person-title">＋ 新規追加</div>
    <div class="add-fields">
      <div class="field-wrap"><label>名前</label><input class="input-small" id="new-name" placeholder="名前"></div>
      <div class="field-wrap"><label>パスワード</label><input class="input-small" id="new-pw" placeholder="0000" inputmode="numeric"></div>
      <div class="field-wrap" style="grid-column:1/-1"><label>貸し金額（円）</label><input class="input-small" id="new-amount" type="number" placeholder="0" inputmode="numeric"></div>
    </div>
    <button class="btn-add" onclick="addPerson()">追加する</button>
  </div>
  <div style="margin-top:32px;display:flex;flex-direction:column;gap:10px;">
    <button class="btn-secondary" style="width:100%;" onclick="goHistoryScreen()">📊 履歴画面へ</button>
    <button class="btn-secondary" style="width:100%;" onclick="goProbScreen()">⚙️ 確率設定画面へ</button>
  </div>
</div>

<!-- HISTORY SCREEN -->
<div id="screen-history" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="showScreen('screen-admin')">‹</button>
    <div class="screen-title">📊 履歴</div>
  </div>

  <div style="display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;">
    <button class="hist-tab active" id="tab-amount" onclick="switchHistTab('amount')">金額変更</button>
    <button class="hist-tab" id="tab-login" onclick="switchHistTab('login')">ログイン</button>
    <button class="hist-tab" id="tab-win" onclick="switchHistTab('win')">当たり</button>
    <button class="hist-tab" id="tab-ticket" onclick="switchHistTab('ticket')">チケット</button>
  </div>

  <select class="select-field" id="hist-person-filter" style="margin-bottom:16px;" onchange="applyHistFilter()">
    <option value="">全員</option>
  </select>

  <div class="history-section" id="panel-amount"><div id="admin-history-list"></div></div>
  <div class="history-section hidden" id="panel-login"><div id="admin-login-list"></div></div>
  <div class="history-section hidden" id="panel-win"><div id="admin-win-list"></div></div>
  <div class="history-section hidden" id="panel-ticket"><div id="admin-ticket-list"></div></div>
</div>

<!-- PROBABILITY SETTINGS SCREEN -->
<div id="screen-prob" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="showScreen('screen-admin')">‹</button>
    <div class="screen-title">⚙️ 確率設定</div>
  </div>

  <div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:14px 16px;margin-bottom:16px;">
    <div class="add-person-title" style="margin-bottom:10px;">🎮 基本確率</div>
    <div class="field-wrap" style="margin-bottom:10px;">
      <label>ミニゲーム基本当選確率（%）</label>
      <input class="input-small" type="number" id="setting-win-prob" min="0" max="100" step="0.1" placeholder="3">
    </div>
  </div>

  <div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:14px 16px;margin-bottom:16px;">
    <div class="add-person-title" style="margin-bottom:10px;">🚀 底上げ設定（0%でOFF・演出無視の強制確率）</div>
    <div class="field-wrap">
      <label>強制当選確率（%）</label>
      <input class="input-small" type="number" id="setting-boost-prob" min="0" max="100" step="0.1" placeholder="0">
    </div>
  </div>

  <div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:14px 16px;margin-bottom:16px;">
    <div class="add-person-title" style="margin-bottom:10px;">🎭 ざわ演出設定</div>
    <div class="field-wrap" style="margin-bottom:10px;">
      <label>通常ざわ 出現率（%）</label>
      <input class="input-small" type="number" id="setting-normal-zawa-rate" min="0" max="100" step="0.1" placeholder="10">
    </div>
    <div class="field-wrap" style="margin-bottom:10px;">
      <label>通常ざわ 当たり率（%）</label>
      <input class="input-small" type="number" id="setting-normal-zawa-win" min="0" max="100" step="0.1" placeholder="15">
    </div>
    <div class="field-wrap" style="margin-bottom:10px;">
      <label>点滅ざわ 当たり率（%）</label>
      <input class="input-small" type="number" id="setting-flash-zawa-win" min="0" max="100" step="0.1" placeholder="85">
    </div>
    <div class="field-wrap">
      <label>点滅ざわ ハズレ時の発生率（%）</label>
      <input class="input-small" type="number" id="setting-flash-zawa-rate" min="0" max="100" step="0.1" placeholder="5">
    </div>
  </div>

  <div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:14px 16px;margin-bottom:16px;">
    <div class="add-person-title" style="margin-bottom:10px;">🎁 当選後の景品配分（合計100%になるように）</div>
    <div class="field-wrap" style="margin-bottom:10px;">
      <label>🚬 タバコ（%）</label>
      <input class="input-small" type="number" id="setting-prize-tabacco" min="0" max="100" step="0.1" placeholder="60">
    </div>
    <div class="field-wrap" style="margin-bottom:10px;">
      <label>🥦 ブロッコリー（%）</label>
      <input class="input-small" type="number" id="setting-prize-broccoli" min="0" max="100" step="0.1" placeholder="30">
    </div>
    <div class="field-wrap">
      <label>✒️ ペン（%）</label>
      <input class="input-small" type="number" id="setting-prize-pen" min="0" max="100" step="0.1" placeholder="10">
    </div>
  </div>

  <button class="btn-primary" onclick="saveAllSettingsFromUI()">全て保存</button>
</div>

<!-- GAME OVERLAY -->
<div class="game-overlay hidden" id="game-overlay">
  <div class="game-title" id="game-title">GAME</div>
  <div id="game-area"></div>
  <div class="game-result" id="game-result"></div>
  <div class="game-sub" id="game-sub"></div>
  <button class="game-action-btn hidden" id="game-action-btn"></button>
  <button class="game-next-btn hidden" id="game-next-btn">次へ</button>
</div>

<!-- 流れるアナウンス -->
<div class="ticker-wrap hidden" id="ticker-wrap">
  <div class="ticker-inner" id="ticker-inner"></div>
</div>

<!-- ZAWA -->
<div class="zawa-overlay hidden" id="zawa-overlay"></div>
<audio id="zawa-audio" src="zawa.mp3" loop></audio>
<audio id="bgm-audio" src="bgm.mov" loop></audio>

<div class="toast" id="toast"></div>

<script>
const ADMIN_PW = '0229';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbymVBoynA2hlpr2lVYxJtsgvxVDzMFOfD9nRbsLB4gLz7YgRqH6UeHRedGW7frOsoC8/exec';
const GAME_UNIT = 2000;
const WIN_PROB = 0.03;
const SLOT_EMOJIS = ['🍋','🍊','🍇','🔔','💎','❌','🍒','⭐'];
const GAMES = ['slot','amida','wheel','janken'];

let cache = [], historyCache = [], loginCache = [], winCache = [], ticketUsageCache = [];
let WIN_PROB_RUNTIME = 0.03;
let LOTTERY_PROB_RUNTIME = null;
let BOOST_PROB_RUNTIME = 0; // 0でOFF、演出無視の強制確率
let NORMAL_ZAWA_RATE = 0.1;
let NORMAL_ZAWA_WIN = 0.15;
let FLASH_ZAWA_WIN = 0.85;
let FLASH_ZAWA_RATE_ON_LOSE = 0.05;
let PRIZE_TABACCO = 0.6;
let PRIZE_BROCCOLI = 0.3;
let PRIZE_PEN = 0.1;

// ── GAS ──
async function fetchData() { const r=await fetch(`${GAS_URL}?action=getAll`); cache=await r.json(); }
async function fetchHistory() { const r=await fetch(`${GAS_URL}?action=getHistory`); historyCache=await r.json(); }
async function fetchLogins() { const r=await fetch(`${GAS_URL}?action=getLogins`); loginCache=await r.json(); }
async function fetchWins() { const r=await fetch(`${GAS_URL}?action=getWins`); winCache=await r.json(); }
async function pushData(d) { await fetch(`${GAS_URL}?action=save&data=${encodeURIComponent(JSON.stringify(d))}`); cache=d; }
async function pushLog(e) { await fetch(`${GAS_URL}?action=log&entry=${encodeURIComponent(JSON.stringify(e))}`); }
async function pushLoginLog(name) { const e={date:new Date().toISOString(),name}; await fetch(`${GAS_URL}?action=logLogin&entry=${encodeURIComponent(JSON.stringify(e))}`); loginCache.push(e); }
async function pushWin(e) { await fetch(`${GAS_URL}?action=logWin&entry=${encodeURIComponent(JSON.stringify(e))}`); winCache.push(e); renderTicker(); }
async function pushTicketUsage(e) { await fetch(`${GAS_URL}?action=logTicketUsage&entry=${encodeURIComponent(JSON.stringify(e))}`); ticketUsageCache.push(e); }
async function fetchTicketUsage() { const r = await fetch(`${GAS_URL}?action=getTicketUsage`); ticketUsageCache = await r.json(); }
async function fetchSettings() {
  const r = await fetch(`${GAS_URL}?action=getSettings`);
  const s = await r.json();
  if(s.winProb!==undefined) WIN_PROB_RUNTIME = Number(s.winProb);
  if(s.lotteryWinProb!==undefined) LOTTERY_PROB_RUNTIME = Number(s.lotteryWinProb);
  if(s.boostProb!==undefined) BOOST_PROB_RUNTIME = Number(s.boostProb);
  if(s.normalZawaRate!==undefined) NORMAL_ZAWA_RATE = Number(s.normalZawaRate);
  if(s.normalZawaWin!==undefined) NORMAL_ZAWA_WIN = Number(s.normalZawaWin);
  if(s.flashZawaWin!==undefined) FLASH_ZAWA_WIN = Number(s.flashZawaWin);
  if(s.flashZawaRateOnLose!==undefined) FLASH_ZAWA_RATE_ON_LOSE = Number(s.flashZawaRateOnLose);
  if(s.prizeTabacco!==undefined) PRIZE_TABACCO = Number(s.prizeTabacco);
  if(s.prizeBroccoli!==undefined) PRIZE_BROCCOLI = Number(s.prizeBroccoli);
  if(s.prizePen!==undefined) PRIZE_PEN = Number(s.prizePen);
}
async function pushAllSettings(settings) {
  const qs = Object.entries(settings).map(([k,v])=>`${k}=${v}`).join('&');
  await fetch(`${GAS_URL}?action=saveSettings&${qs}`);
  WIN_PROB_RUNTIME = settings.winProb;
  LOTTERY_PROB_RUNTIME = settings.lotteryWinProb;
  BOOST_PROB_RUNTIME = settings.boostProb;
  NORMAL_ZAWA_RATE = settings.normalZawaRate;
  NORMAL_ZAWA_WIN = settings.normalZawaWin;
  FLASH_ZAWA_WIN = settings.flashZawaWin;
  FLASH_ZAWA_RATE_ON_LOSE = settings.flashZawaRateOnLose;
  PRIZE_TABACCO = settings.prizeTabacco;
  PRIZE_BROCCOLI = settings.prizeBroccoli;
  PRIZE_PEN = settings.prizePen;
}
async function clearTickets(id) { await fetchData(); const i=cache.findIndex(p=>String(p.id)===String(id)); if(i===-1)return; cache[i].roulette_tickets=0; await pushData(cache); }

function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function showScreen(id) { document.getElementById('screen-top').style.display='none'; document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function goTop() { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('screen-top').style.display=''; }
function formatDate(s) { const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function nowStr() { const d=new Date(); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

// ── ざわ ──
function showZawa(duration, flash, onDone) {
  const overlay = document.getElementById('zawa-overlay');
  const audio = document.getElementById('zawa-audio');
  overlay.innerHTML = '';
  overlay.classList.remove('hidden');
  overlay.classList.add('shake');
  if (flash) overlay.classList.add('flash'); else overlay.classList.remove('flash');
  audio.currentTime = 0;
  audio.play().catch(()=>{});

  const timer = setInterval(() => {
    if (overlay.classList.contains('hidden')) return;
    const el = document.createElement('div');
    el.className = 'zawa-text';
    el.textContent = 'ざわ…';
    el.style.fontSize = (24 + Math.random()*40) + 'px';
    el.style.left = (5 + Math.random()*80) + '%';
    el.style.top = (5 + Math.random()*80) + '%';
    overlay.appendChild(el);
    setTimeout(() => el.remove(), 1400);
  }, 180);

  setTimeout(() => {
    clearInterval(timer);
    audio.pause(); audio.currentTime = 0;
    overlay.classList.remove('flash');
    overlay.classList.remove('shake');
    overlay.classList.add('hidden');
    overlay.innerHTML = '';
    onDone();
  }, duration);
}

function showLotteryAmida(ui, onNext, winnerName) {
  const COLS = 6;
  // 設定確率に応じて6マスの内訳を決める（四捨五入して合計6になるよう調整）
  let nTabacco = Math.round(PRIZE_TABACCO * COLS);
  let nBroccoli = Math.round(PRIZE_BROCCOLI * COLS);
  let nPen = COLS - nTabacco - nBroccoli;
  if (nPen < 0) { nPen = 0; nBroccoli = COLS - nTabacco; }
  const PRIZES = [
    ...Array(nTabacco).fill('🚬'),
    ...Array(nBroccoli).fill('🥦'),
    ...Array(nPen).fill('✒️')
  ];
  const ROWS = 5;
  const W = 300, H = 180;
  const colX = [25, 75, 130, 180, 235, 285];
  const rowH = H / (ROWS + 1);

  // ゴールをシャッフル
  const goals = [...PRIZES].sort(() => Math.random() - 0.5);

  // 横棒生成
  const bars = [];
  for (let row = 0; row < ROWS; row++) {
    const used = new Set();
    for (let c = 0; c < COLS - 1; c++) {
      if (!used.has(c) && !used.has(c+1) && Math.random() < 0.4) {
        bars.push({ row, c });
        used.add(c); used.add(c+1);
      }
    }
  }

  function trace(startCol) {
    let col = startCol;
    for (let row = 0; row < ROWS; row++) {
      const bar = bars.find(b => b.row === row && (b.c === col || b.c === col - 1));
      if (bar) col = bar.c === col ? col + 1 : col - 1;
    }
    return col;
  }

  ui.result.textContent = '';
  ui.sub.textContent = '';
  ui.actionBtn.classList.add('hidden');
  ui.nextBtn.classList.add('hidden');

  ui.area.innerHTML = '<div style="width:100%;max-width:320px;">'
    + '<div style="font-size:11px;color:#555;letter-spacing:2px;text-align:center;margin-bottom:12px;">スタートを選んでね</div>'
    + '<div id="lottery-btns" style="display:flex;justify-content:space-around;margin-bottom:6px;"></div>'
    + '<canvas id="lottery-canvas" width="' + W + '" height="' + H + '" style="display:block;margin:0 auto;"></canvas>'
    + '<div id="lottery-goals" style="display:flex;justify-content:space-around;margin-top:6px;"></div>'
    + '</div>';

  const canvas = document.getElementById('lottery-canvas');
  const ctx = canvas.getContext('2d');

  function draw(highlightPath) {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    colX.forEach(x => { ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x, H - 8); ctx.stroke(); });
    bars.forEach(b => {
      ctx.beginPath();
      ctx.moveTo(colX[b.c], (b.row + 1) * rowH);
      ctx.lineTo(colX[b.c + 1], (b.row + 1) * rowH);
      ctx.stroke();
    });
    if (highlightPath && highlightPath.length > 1) {
      ctx.strokeStyle = '#e8c84a'; ctx.lineWidth = 3;
      for (let i = 0; i < highlightPath.length - 1; i++) {
        ctx.beginPath();
        ctx.moveTo(highlightPath[i].x, highlightPath[i].y);
        ctx.lineTo(highlightPath[i+1].x, highlightPath[i+1].y);
        ctx.stroke();
      }
    }
  }
  draw();

  // ゴール表示（最初は隠す）
  const goalsEl = document.getElementById('lottery-goals');
  for (let i = 0; i < COLS; i++) {
    const d = document.createElement('div');
    d.style.cssText = 'width:40px;text-align:center;font-size:18px;';
    d.textContent = '？';
    goalsEl.appendChild(d);
  }

  // スタートボタン
  const btnsEl = document.getElementById('lottery-btns');
  for (let i = 0; i < COLS; i++) {
    const btn = document.createElement('button');
    btn.style.cssText = 'background:#1a1a1a;border:2px solid #333;color:#f0f0f0;border-radius:6px;padding:6px 0;font-size:13px;font-weight:700;cursor:pointer;width:40px;';
    btn.textContent = i + 1;
    btn.onclick = () => {
      btnsEl.querySelectorAll('button').forEach(b => { b.disabled = true; b.style.opacity = '0.4'; });
      btn.style.borderColor = '#e8c84a';
      btn.style.color = '#e8c84a';
      btn.style.opacity = '1';

      // パス計算
      let col = i;
      const path = [{ x: colX[col], y: 8 }];
      for (let row = 0; row < ROWS; row++) {
        path.push({ x: colX[col], y: (row + 1) * rowH });
        const bar = bars.find(b => b.row === row && (b.c === col || b.c === col - 1));
        if (bar) {
          const newCol = bar.c === col ? col + 1 : col - 1;
          path.push({ x: colX[newCol], y: (row + 1) * rowH });
          col = newCol;
        }
      }
      path.push({ x: colX[col], y: H - 8 });

      let step = 0;
      const timer = setInterval(() => {
        step++;
        draw(path.slice(0, step + 1));
        if (step >= path.length - 1) {
          clearInterval(timer);
          // ゴール公開
          goalsEl.querySelectorAll('div').forEach((el, gi) => {
            el.textContent = goals[gi];
          });
          const prize = goals[col];
          const prizeLabel = prize === '🚬' ? 'タバコ' : prize === '🥦' ? 'ブロッコリー' : 'ペン';
          pushWin({ date: new Date().toISOString(), name: winnerName, prize });
          setTimeout(() => {
            ui.area.innerHTML = '';
            ui.result.innerHTML = '<span style="font-size:56px;">' + prize + '</span>';
            ui.sub.innerHTML = '<div style="color:#e8c84a;font-size:18px;font-weight:700;margin-bottom:8px;">' + prizeLabel + '</div>'
              + '<div style="color:#e8c84a;font-size:13px;margin-bottom:8px;">' + nowStr() + '</div>'
              + '<div style="color:#555;font-size:12px;">スクショを撮ってね 📸</div>';
            // ボタンを有効化してから次へを表示
            document.querySelectorAll('.game-overlay button').forEach(b => { b.disabled = false; });
            showNextBtn(onNext);
          }, 800);
        }
      }, 70);
    };
    btnsEl.appendChild(btn);
  }
}

// ── ゲーム起動 ──
async function userStartGame() {
  const tickets = window._currentTickets || 0;
  const personId = window._currentPersonId;
  const name = window._currentPersonName;
  if (tickets <= 0) return;
  showTicketConfirm(tickets, personId, name, async () => {
    // ゲーム終了後、最新データで画面更新
    await fetchData();
    const updated = cache.find(p => String(p.id) === String(personId));
    if (updated) {
      document.getElementById('detail-amount').innerHTML = Number(updated.amount||0).toLocaleString()+'<span>円</span>';
      renderProgress(updated);
      const newTickets = Number(updated.roulette_tickets)||0;
      const btnWrap = document.getElementById('user-game-btn-wrap');
      const ticketCountEl = document.getElementById('user-ticket-count');
      if (newTickets > 0) {
        btnWrap.style.display = 'block';
        ticketCountEl.textContent = '🎟️ ' + newTickets + '枚あります';
        window._currentTickets = newTickets;
      } else {
        btnWrap.style.display = 'none';
      }
    }
  });
}

function showTicketConfirm(totalTickets, personId, name, onComplete) {
  const overlay = document.getElementById('game-overlay');
  const ui = getUI();
  overlay.classList.remove('hidden');
  overlay.style.display = 'flex';
  resetUI('🎮 GAME');

  ui.result.className = 'game-result';
  ui.result.innerHTML = '<span style="font-size:32px;">🎟️</span>';
  ui.sub.innerHTML = '<div style="color:#e8c84a;font-size:18px;font-weight:700;margin-bottom:16px;">' + totalTickets + '枚あります</div>'
    + '<div style="color:#555;font-size:13px;margin-bottom:16px;">何回遊びますか？</div>'
    + '<div style="display:flex;gap:8px;align-items:center;justify-content:center;">'
    + '<input id="ticket-input" type="number" min="0" max="' + totalTickets + '" value="1" inputmode="numeric" '
    + 'style="width:80px;background:#1a1a1a;border:1px solid #e8c84a;border-radius:8px;padding:10px;color:#f0f0f0;font-size:18px;font-weight:700;text-align:center;outline:none;">'
    + '<span style="color:#555;font-size:13px;">/ ' + totalTickets + '枚</span>'
    + '</div>';

  ui.actionBtn.textContent = '確認';
  ui.actionBtn.classList.remove('hidden');
  ui.actionBtn.onclick = async () => {
    const input = document.getElementById('ticket-input');
    const use = Math.min(Math.max(0, Number(input.value)||0), totalTickets);

    if (use <= 0) {
      overlay.classList.add('hidden');
      return;
    }

    const remain = totalTickets - use;

    ui.actionBtn.classList.add('hidden');
    ui.sub.textContent = 'チケットを消費中...';

    // チケット消費（最新データ取得後に変更）
    await fetchData();
    const idx = cache.findIndex(p=>String(p.id)===String(personId));
    if(idx!==-1){
      const latestTickets = Number(cache[idx].roulette_tickets)||0;
      cache[idx].roulette_tickets = Math.max(0, latestTickets - use);
      await pushData(cache);
    }
    await pushTicketUsage({ date: new Date().toISOString(), name, count: use });

    ui.sub.textContent = '';
    runGames(use, name, () => { if (onComplete) onComplete(); });
  };

  ui.nextBtn.classList.add('hidden');
}

function runGames(tickets, name, onDone) {
  if (tickets <= 0) { onDone(); return; }
  const overlay = document.getElementById('game-overlay');
  const ui = getUI();
  overlay.classList.remove('hidden');
  resetUI('🎮 GAME');
  ui.sub.textContent = tickets + '回のゲームチャンス！';

  // スタートボタン（音声unlock）
  ui.actionBtn.textContent = 'スタート';
  ui.actionBtn.classList.remove('hidden');
  ui.actionBtn.onclick = () => {
    // 音声unlock: スタートタップで即再生
    const zawaAudio = document.getElementById('zawa-audio');
    const bgmAudio = document.getElementById('bgm-audio');
    const unlockAudio = (a) => {
      if (!a) return;
      a.volume = 0.001;
      const p = a.play();
      if (p) p.then(() => { setTimeout(() => { a.pause(); a.currentTime = 0; a.volume = 1; }, 100); }).catch(()=>{});
    };
    unlockAudio(zawaAudio);
    unlockAudio(bgmAudio);
    ui.actionBtn.classList.add('hidden');
    ui.sub.textContent = '';

    let remaining = tickets;

    function nextGame() {
      if (remaining <= 0) { overlay.classList.add('hidden'); onDone(); return; }
      remaining--;
      const gameType = GAMES[Math.floor(Math.random() * GAMES.length)];

      // 底上げ設定が有効な場合は演出を完全無視して強制確率
      if (BOOST_PROB_RUNTIME > 0) {
        const won = Math.random() < BOOST_PROB_RUNTIME;
        launchGame(gameType, won, name, () => nextGame());
        return;
      }

      const baseWon = Math.random() < WIN_PROB_RUNTIME;

      // 演出抽選
      const showNormalZawa = Math.random() < NORMAL_ZAWA_RATE;
      const showFlashZawa = !showNormalZawa && (baseWon || Math.random() < FLASH_ZAWA_RATE_ON_LOSE);

      if (showFlashZawa) {
        const won = Math.random() < FLASH_ZAWA_WIN;
        const gameOverlay = document.getElementById('game-overlay');
        gameOverlay.classList.add('hidden');
        showZawa(2500, true, () => {
          gameOverlay.classList.remove('hidden');
          gameOverlay.style.display = 'flex';
          launchGame(gameType, won, name, () => nextGame());
        });
      } else if (showNormalZawa) {
        const won = Math.random() < NORMAL_ZAWA_WIN;
        showZawa(2000, false, () => {
          document.getElementById('game-overlay').style.display = 'flex';
          launchGame(gameType, won, name, () => nextGame());
        });
      } else {
        launchGame(gameType, baseWon, name, () => nextGame());
      }
    }
    nextGame();
  };
}

function launchGame(type, won, name, onDone) {
  const label = type === 'slot' ? '🎰 SLOT' : type === 'amida' ? '🪜 あみだくじ' : type === 'wheel' ? '🎡 ROULETTE' : '✊ ジャンケン';
  resetUI(label);
  _launchGameInner(type, won, name, onDone);
}
function _launchGameInner(type, won, name, onDone) {
  // 当たり/ハズレ後の共通処理
  function onResult(isWon) {
    if (isWon) {
      showWinResult(name, onDone);
    } else {
      showLoseResult(onDone);
    }
  }

  if (type === 'slot') launchSlot(won, onResult);
  else if (type === 'amida') launchAmida(won, onResult);
  else if (type === 'wheel') launchWheel(won, onResult);
  else launchJanken(won, onResult);
}

// ── スロット ──
function launchSlot(won, onResult) {
  const ui = getUI();
  const finalEmoji = won ? '7️⃣' : SLOT_EMOJIS[Math.floor(Math.random() * SLOT_EMOJIS.length)];
  ui.nextBtn.classList.add('hidden'); // 次へを隠す
  ui.area.innerHTML = '<div class="slot-machine">'
    + '<div class="slot-reel spinning" id="sr0">🎰</div>'
    + '<div class="slot-reel spinning" id="sr1">🎰</div>'
    + '<div class="slot-reel spinning" id="sr2">🎰</div>'
    + '</div>';
  ui.sub.textContent = 'タイミングを見てSTOP！';
  ui.actionBtn.textContent = 'STOP';
  ui.actionBtn.classList.remove('hidden');

  let stopped = false;
  ui.actionBtn.onclick = () => {
    if (stopped) return;
    stopped = true;
    ui.actionBtn.disabled = true;
    ui.sub.textContent = '';

    setTimeout(() => { const r=document.getElementById('sr0'); if(r){r.classList.remove('spinning'); r.textContent='7️⃣';} }, 0);
    setTimeout(() => { const r=document.getElementById('sr1'); if(r){r.classList.remove('spinning'); r.textContent='7️⃣';} }, 400);
    setTimeout(() => {
      const r=document.getElementById('sr2'); if(r){r.classList.remove('spinning'); r.textContent=finalEmoji;}
      ui.actionBtn.disabled = false;
      ui.actionBtn.classList.add('hidden');
      if (won) document.querySelectorAll('.slot-reel').forEach(el=>el.classList.add('win-reel'));
      // リール停止後1秒待ってから結果へ
      setTimeout(() => onResult(won), 1000);
    }, 800);
  };
}

// ── あみだくじ ──
function launchAmida(won, onResult) {
  const ui = getUI();
  ui.actionBtn.classList.add('hidden');
  ui.nextBtn.classList.add('hidden');
  const COLS = 4, ROWS = 6;
  const W = 280, H = 200;
  const colX = [40, 100, 180, 240];
  const rowH = H / (ROWS + 1);

  // ハズレ演出バリエーション（ハズレ時のみ）
  // 0: 当たりだらけ（当たり3、ハズレ1）, 1: ハズレだらけ（当たり1、ハズレ3）, 2: 普通（当たり1、ハズレ3）
  const missType = won ? -1 : (Math.random() < 0.6 ? 0 : Math.floor(Math.random() * 2) + 1); // 60%で当たりだらけ演出

  // 横棒生成
  const bars = [];
  for (let row = 0; row < ROWS; row++) {
    bars.push({ row, c: Math.floor(Math.random() * (COLS - 1)) });
  }

  // trace関数
  function trace(startCol) {
    let col = startCol;
    for (let row = 0; row < ROWS; row++) {
      const bar = bars.find(b => b.row === row && (b.c === col || b.c === col - 1));
      if (bar) col = bar.c === col ? col + 1 : col - 1;
    }
    return col;
  }

  // 各スタートの到達先をマッピング
  const destMap = {};
  for (let i = 0; i < COLS; i++) destMap[i] = trace(i);

  // 当たりゴールをランダムに決定
  const winGoal = Math.floor(Math.random() * COLS);

  // 当たりスタートを保証
  let winStart = parseInt(Object.keys(destMap).find(k => destMap[k] === winGoal));
  if (isNaN(winStart)) {
    winStart = Math.floor(Math.random() * COLS);
    destMap[winStart] = winGoal;
  }

  // ゴール配置を演出タイプで変える
  // missType 0: 当たりだらけ（3つ当たり、1つハズレ）→ won=falseでも当たりに見える
  // missType 1,2: 普通（1つ当たり、3つハズレ）
  let goalDisplay; // 各ゴールの表示
  if (won) {
    goalDisplay = Array(COLS).fill('✕');
    goalDisplay[winGoal] = '🎊';
  } else if (missType === 0) {
    // 当たりだらけ演出（3つ🎊、1つ✕）
    goalDisplay = Array(COLS).fill('🎊');
    goalDisplay[winGoal] = '✕'; // winGoalだけハズレ（当たりのゴールがハズレに見える）
  } else {
    // 普通
    goalDisplay = Array(COLS).fill('✕');
    goalDisplay[winGoal] = '🎊';
  }

  ui.area.innerHTML = `
    <div class="amida-wrap">
      <div class="amida-start-btns" id="amida-btns"></div>
      <canvas class="amida-canvas" id="amida-canvas" width="${W}" height="${H}"></canvas>
      <div class="amida-goals" id="amida-goals"></div>
    </div>`;

  const canvas = document.getElementById('amida-canvas');
  const ctx = canvas.getContext('2d');

  function draw(highlightPath) {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
    colX.forEach(x => { ctx.beginPath(); ctx.moveTo(x,10); ctx.lineTo(x,H-10); ctx.stroke(); });
    bars.forEach(b => {
      ctx.beginPath();
      ctx.moveTo(colX[b.c], (b.row+1)*rowH);
      ctx.lineTo(colX[b.c+1], (b.row+1)*rowH);
      ctx.stroke();
    });
    if (highlightPath && highlightPath.length > 1) {
      ctx.strokeStyle = '#e8c84a'; ctx.lineWidth = 4;
      for (let i = 0; i < highlightPath.length-1; i++) {
        ctx.beginPath();
        ctx.moveTo(highlightPath[i].x, highlightPath[i].y);
        ctx.lineTo(highlightPath[i+1].x, highlightPath[i+1].y);
        ctx.stroke();
      }
    }
  }
  draw();

  // ゴール（隠す）
  const goalsEl = document.getElementById('amida-goals');
  for (let i = 0; i < COLS; i++) {
    const d = document.createElement('div');
    d.className = 'amida-goal';
    d.textContent = '？';
    goalsEl.appendChild(d);
  }

  // スタートボタン
  const btnsEl = document.getElementById('amida-btns');
  for (let i = 0; i < COLS; i++) {
    const btn = document.createElement('button');
    btn.className = 'amida-btn';
    btn.textContent = i + 1;
    btn.onclick = () => {
      btnsEl.querySelectorAll('.amida-btn').forEach(b => b.disabled = true);
      btn.classList.add('selected');
      ui.sub.textContent = 'たどってるよ...';

      // 押したボタンiをそのまま使う。wonならiからwinGoalに到達するよう経路を偽装
      // 実際のパスはiのtraceに従う（見た目と一致）
      // wonの場合: ユーザーが選んだiがwinStartになるようにbarsを調整済みではなく
      // ユーザーのiの到達先をwonならwinGoalに見せる（視覚的に正しい経路）

      // パス計算（実際のbarsに従ってユーザーが選んだiをトレース）
      let col = i;
      const path = [{ x: colX[col], y: 10 }];
      for (let row = 0; row < ROWS; row++) {
        path.push({ x: colX[col], y: (row+1)*rowH });
        const bar = bars.find(b => b.row === row && (b.c === col || b.c === col-1));
        if (bar) {
          const newCol = bar.c === col ? col+1 : col-1;
          path.push({ x: colX[newCol], y: (row+1)*rowH });
          col = newCol;
        }
      }
      path.push({ x: colX[col], y: H-10 });
      const actualGoal = col;

      // won（当たり確定）なら、選んだボタンに関係なく必ず当たりゴールに到達させる
      const finalGoal = won ? winGoal : actualGoal;
      if (won) {
        path[path.length-1] = { x: colX[winGoal], y: H-10 };
      }
      const isWin = won;

      let step = 0;
      const timer = setInterval(() => {
        step++;
        draw(path.slice(0, step+1));
        if (step >= path.length-1) {
          clearInterval(timer);
          // ゴール公開
          goalsEl.querySelectorAll('.amida-goal').forEach((el, gi) => {
            el.textContent = gi === finalGoal ? (isWin ? '🎊' : '✕') : (gi === winGoal && !isWin ? '🎊' : '✕');
          });
          setTimeout(() => onResult(isWin), 500);
        }
      }, 80);
    };
    btnsEl.appendChild(btn);
  }
  ui.sub.textContent = 'スタートを選んでね';
}

// ── ルーレット ──
function launchWheel(won, onResult) {
  const ui = getUI();
  ui.actionBtn.classList.add('hidden');
  ui.nextBtn.classList.add('hidden');
  const SIZE = 220;
  ui.area.innerHTML = `
    <div class="wheel-wrap">
      <canvas class="wheel-canvas" id="wheel-canvas" width="${SIZE}" height="${SIZE}"></canvas>
      <div class="wheel-needle">▼</div>
    </div>`;
  ui.sub.textContent = 'タイミングを見てSTOP！';
  ui.actionBtn.textContent = 'STOP';
  ui.actionBtn.classList.remove('hidden');

  const canvas = document.getElementById('wheel-canvas');
  const ctx = canvas.getContext('2d');
  const cx=SIZE/2, cy=SIZE/2, radius=SIZE/2-4;
  const SEGS=12, segAngle=(Math.PI*2)/SEGS, WIN_SEG=11;
  const colors = Array.from({length:SEGS}, (_,i)=>i===WIN_SEG?'#e8c84a22':i%2===0?'#1a1a1a':'#222');

  let angle=0, animId;
  function drawWheel() {
    ctx.clearRect(0,0,SIZE,SIZE);
    for (let i=0;i<SEGS;i++) {
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,radius,angle+i*segAngle,angle+(i+1)*segAngle);
      ctx.fillStyle=colors[i]; ctx.fill();
      ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.stroke();
      if (i===WIN_SEG) {
        ctx.save(); ctx.translate(cx,cy);
        ctx.rotate(angle+i*segAngle+segAngle/2);
        ctx.fillStyle='#e8c84a'; ctx.font='bold 14px sans-serif';
        ctx.fillText('★',radius*0.65,5); ctx.restore();
      }
    }
    ctx.beginPath(); ctx.arc(cx,cy,16,0,Math.PI*2);
    ctx.fillStyle='#0d0d0d'; ctx.fill();
  }
  function animate() { angle+=0.12; drawWheel(); animId=requestAnimationFrame(animate); }
  animate();

  let stopped=false;
  ui.actionBtn.onclick=()=>{
    if(stopped)return; stopped=true;
    ui.actionBtn.disabled=true;
    cancelAnimationFrame(animId);

    const targetSeg = won ? WIN_SEG : Math.floor(Math.random()*(SEGS-1));
    const targetAngle = -(targetSeg*segAngle+segAngle/2)-Math.PI/2;
    const current=angle%(Math.PI*2);
    let diff=(targetAngle%(Math.PI*2))-current;
    if(diff<0)diff+=Math.PI*2;
    const finalAngle=angle+diff+Math.PI*4;
    const duration=1200, start=performance.now(), startAngle=angle;

    function ease(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
    function stopAnim(now){
      const t=Math.min((now-start)/duration,1);
      angle=startAngle+(finalAngle-startAngle)*ease(t);
      drawWheel();
      if(t<1){requestAnimationFrame(stopAnim);}
      else{
        ui.actionBtn.disabled=false;
        ui.actionBtn.classList.add('hidden');
        onResult(won);
      }
    }
    requestAnimationFrame(stopAnim);
  };
}

      </div>

  hands.forEach((_, playerIdx) => {
    document.getElementById('jk-'+playerIdx).onclick = () => {
      document.querySelectorAll('.janken-btn').forEach(b=>b.disabled=true);
      ui.sub.textContent='CPU考え中...';
      setTimeout(()=>{
        // グー(0)>チョキ(1), チョキ(1)>パー(2), パー(2)>グー(0)
        // プレイヤーが勝つ = CPUはプレイヤーに負ける手 = (playerIdx+1)%3
        // CPUが勝つ = (playerIdx+2)%3
        const cpuIdx = won ? (playerIdx+1)%3 : (Math.random()<0.5 ? (playerIdx+2)%3 : playerIdx);
        ui.area.innerHTML=`
          <div style="display:flex;justify-content:center;gap:32px;align-items:center;">
            <div style="text-align:center;"><div style="font-size:11px;color:#555;margin-bottom:8px;">あなた</div><div style="font-size:56px;">${hands[playerIdx]}</div></div>
            <div style="font-size:20px;color:#333;">VS</div>

          </div>`;
        setTimeout(()=>{
          const isWin = won;
          if (!isWin && playerIdx===cpuIdx) {
            ui.result.className='game-result lose';
            ui.result.textContent='あいこ';
            showNextBtn(()=>onResult(false));
          } else {
            onResult(isWin);
          }
        },600);
      },800);
    };
  });
}

function renderHistoryList(containerId, items) {
  const el=document.getElementById(containerId);
  if(!items||items.length===0){el.innerHTML='<div class="history-empty">履歴なし</div>';return;}

  // 人ごとにグループ化
  const groups = {};
  [...items].reverse().forEach(h => {
    if (!groups[h.name]) groups[h.name] = [];
    groups[h.name].push(h);
  });

  el.innerHTML = Object.entries(groups).map(([name, records]) => {
    const rows = records.map(h => {
      const before=Number(h.before),after=Number(h.after),diff=after-before;
      const diffStr=(diff>=0?'+':'')+diff.toLocaleString()+'円';
      const diffColor=diff>=0?'#e84a4a':'#4ae87a';
      return `<div style="padding:8px 0;border-bottom:1px solid #181818;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:11px;color:#444;">${formatDate(h.date)}</div>
          <div style="font-size:12px;color:#555;margin-top:2px;">
            <span style="text-decoration:line-through;">${before.toLocaleString()}円</span>
            <span style="margin:0 4px;">→</span>
            <span style="color:#f0f0f0;font-weight:700;">${after.toLocaleString()}円</span>
          </div>
        </div>
        <div style="font-size:14px;font-weight:800;color:${diffColor};">${diffStr}</div>
      </div>`;
    }).join('');

    return `<div class="history-item">
      <div class="history-item-header" onclick="toggleHistory(this)">
        <div style="font-size:14px;font-weight:700;">${name} <span style="font-size:11px;color:#555;font-weight:400;">${records.length}件</span></div>
        <span class="chevron">›</span>
      </div>
      <div class="history-item-body">${rows}</div>

  }).join('');
}

let currentHistTab = 'amount';

let stampCardIndex = 0; // 0 = 1枚目

function goStampScreen() {
  const person = cache.find(p => String(p.id) === String(window._currentPersonId));
  if (!person) return;
  const points = Number(person.stamp_points) || 0;
  stampCardIndex = Math.floor(points / 100); // 最新のカードから表示
  document.getElementById('stamp-name').textContent = person.name;
  document.getElementById('stamp-points').textContent = points.toLocaleString();
  renderStampCard(points);
  showScreen('screen-stamp');
}

function changeStampCard(dir) {
  const person = cache.find(p => String(p.id) === String(window._currentPersonId));
  if (!person) return;
  const points = Number(person.stamp_points) || 0;
  const maxIndex = Math.floor(points / 100);
  stampCardIndex = Math.min(maxIndex, Math.max(0, stampCardIndex + dir));
  renderStampCard(points);
}

function renderStampCard(totalPoints) {
  document.getElementById('stamp-card-label').textContent = (stampCardIndex + 1) + '枚目';
  document.getElementById('stamp-prev-btn').style.visibility = stampCardIndex > 0 ? 'visible' : 'hidden';
  const maxIndex = Math.floor(totalPoints / 100);
  document.getElementById('stamp-next-btn').style.visibility = stampCardIndex < maxIndex ? 'visible' : 'hidden';

  // このカードで埋まってるマス数を計算
  const cardStart = stampCardIndex * 100;
  const filledInThisCard = Math.max(0, Math.min(100, totalPoints - cardStart));

  const overlay = document.getElementById('stamp-overlay');
  overlay.innerHTML = '';

  // 10x10グリッド。画像の余白を考慮した%座標（実測に近い概算）
  const cols = 10, rows = 10;
  const gridLeft = 15.5, gridTop = 25, gridRight = 88, gridBottom = 96;
  const cellW = (gridRight - gridLeft) / cols;
  const cellH = (gridBottom - gridTop) / rows;

  for (let i = 0; i < 100; i++) {
    if (i >= filledInThisCard) continue;
    const row = Math.floor(i / cols);
    const col = i % cols;
    const cx = gridLeft + cellW * (col + 0.5);
    const cy = gridTop + cellH * (row + 0.5);
    const mark = document.createElement('div');
    mark.style.cssText = 'position:absolute;left:' + cx + '%;top:' + cy + '%;transform:translate(-50%,-50%);font-size:min(4vw,18px);color:#e84a4a;font-weight:900;pointer-events:none;text-shadow:0 0 3px rgba(255,255,255,0.8);';
    mark.textContent = '✔️';
    overlay.appendChild(mark);
  }
}

      <div class="history-item-body">${rows}</div>
    </div>`;
  }).join('');
}

// ── 流れるアナウンス ──
function renderTicker() {
  const wrap = document.getElementById('ticker-wrap');
  const inner = document.getElementById('ticker-inner');
  if (!winCache || winCache.length === 0) { wrap.classList.add('hidden'); return; }

  // 直近5件
  const recent = [...winCache].reverse().slice(0, 5);

  const text = recent.map(h => {
    const d = new Date(h.date);
    const timeStr = (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    return '🎉 ' + h.name + ' が ' + timeStr + ' に ' + (h.prize||'🎊') + ' 当選！';
  }).join('　　　');

  inner.textContent = text;
  wrap.classList.remove('hidden');

  // テキスト長に応じてアニメーション速度調整
  const duration = Math.max(12, text.length * 0.18);
  inner.style.animationDuration = duration + 's';
}

// ── STAMP CARD SLOT ──
function runStampSlots(count, personId, name) {
  const overlay = document.getElementById('game-overlay');
  const ui = getUI();
  overlay.classList.remove('hidden');
  overlay.style.display = 'flex';
  resetUI('🎫 スタンプスロット');
  ui.sub.textContent = count + '回のスロット権があります！';
  ui.actionBtn.textContent = 'スタート';
  ui.actionBtn.classList.remove('hidden');

  ui.actionBtn.onclick = async () => {
    // スロット権を先にクリア
    await fetchData();
    const idx = cache.findIndex(p => String(p.id) === String(personId));
    if (idx !== -1) { cache[idx].stamp_slot_tickets = 0; await pushData(cache); }

    ui.actionBtn.classList.add('hidden');
    ui.sub.textContent = '';

    let remaining = count;
    function nextSlot() {
      if (remaining <= 0) { overlay.classList.add('hidden'); return; }
      remaining--;
      launchStampSlot(name, () => nextSlot());
    }
    nextSlot();
  };
}

function launchStampSlot(name, onDone) {
  const ui = getUI();
  resetUI('🎫 スタンプスロット');
  const SYMBOLS = ['🚬','🥦','✒️'];
  const rand = Math.random();
  const result = rand < 0.7 ? '🚬' : rand < 0.9 ? '🥦' : '✒️';

  ui.area.innerHTML = '<div class="slot-machine">'
    + '<div class="slot-reel spinning" id="ssr0">🎰</div>'
    + '<div class="slot-reel spinning" id="ssr1">🎰</div>'
    + '<div class="slot-reel spinning" id="ssr2">🎰</div>'
    + '</div>';
  ui.sub.textContent = '回転中…';

  setTimeout(() => { const r=document.getElementById('ssr0'); if(r){r.classList.remove('spinning'); r.textContent=result;} }, 600);
  setTimeout(() => { const r=document.getElementById('ssr1'); if(r){r.classList.remove('spinning'); r.textContent=result;} }, 1100);
  setTimeout(() => {
    const r=document.getElementById('ssr2'); if(r){r.classList.remove('spinning'); r.textContent=result;}
    document.querySelectorAll('.slot-reel').forEach(el=>el.classList.add('win-reel'));
    ui.sub.textContent = '';
    pushWin({ date: new Date().toISOString(), name, prize: result });
    setTimeout(() => {
      ui.result.className = 'game-result win';
      ui.result.innerHTML = '<span style="font-size:56px;">' + result + '</span>';
      ui.sub.innerHTML = '<div style="color:#e8c84a;font-size:13px;margin-bottom:8px;">' + nowStr() + '</div>'
        + '<div style="color:#555;font-size:12px;">スクショを撮ってね 📸</div>';
      showNextBtn(onDone);
    }, 800);
  }, 1600);
}

async function saveRow(id){
  await fetchData(); // 最新データを取得してから変更
  const idx=cache.findIndex(p=>String(p.id)===String(id));
  if(idx===-1)return;
  const before=Number(cache[idx].amount)||0;
  const addAmt=Number(document.getElementById('add-'+id).value)||0;
  const subAmt=Number(document.getElementById('sub-'+id).value)||0;
  cache[idx].password=document.getElementById('pw-'+id).value.trim();
  if(addAmt===0&&subAmt===0){await pushData(cache);renderAdmin();showToast('保存しました！');return;}
  const after=Math.max(0,before+addAmt-subAmt);
  const diff=before-after;
  cache[idx].amount=after;
  if(diff>0){
    let progress=Number(cache[idx].roulette_progress)||0;
    let tickets=Number(cache[idx].roulette_tickets)||0;
    progress+=diff;
    while(progress>=GAME_UNIT){progress-=GAME_UNIT;tickets++;}
    cache[idx].roulette_progress=progress;
    cache[idx].roulette_tickets=tickets;
  }
  showToast('保存中...');
  await pushData(cache);
  if(before!==after){
    const entry={date:new Date().toISOString(),name:cache[idx].name,before,after};
    await pushLog(entry);historyCache.push(entry);
    renderHistoryList('admin-history-list',historyCache);
  }
  await fetchData(); // GASから最新データを取得して複製防止
  renderAdmin();showToast('保存しました！');
}

async function addCharge(id){
  await fetchData(); // 最新データを取得してから変更
  const idx=cache.findIndex(p=>String(p.id)===String(id));
  if(idx===-1)return;
  const amount=Number(document.getElementById('charge-'+id).value)||0;
  if(amount<=0){showToast('金額を入力してください');return;}
  let progress=Number(cache[idx].roulette_progress)||0;
  let tickets=Number(cache[idx].roulette_tickets)||0;
  progress+=amount;
  while(progress>=GAME_UNIT){progress-=GAME_UNIT;tickets++;}
  cache[idx].roulette_progress=progress;
  cache[idx].roulette_tickets=tickets;
  showToast('チャージ中...');
  await pushData(cache);
  document.getElementById('charge-'+id).value='';
  await fetchData();
  renderAdmin();showToast('チャージ完了！');
}

async function addStampPoints(id, name) {
  await fetchData();
  const idx = cache.findIndex(p => String(p.id) === String(id));
  if (idx === -1) return;

  const brocCount = Number(document.getElementById('stamp-broc-'+id).value) || 0;
  const penCount = Number(document.getElementById('stamp-pen-'+id).value) || 0;
  const customPoint = Number(document.getElementById('stamp-custom-point-'+id).value) || 0;
  const customCount = Number(document.getElementById('stamp-custom-count-'+id).value) || 0;

  const addPoints = brocCount * 1 + penCount * 3 + customPoint * customCount;
  if (addPoints === 0) { showToast('数を入力してください'); return; }

  let points = Number(cache[idx].stamp_points) || 0;
  let slotTickets = Number(cache[idx].stamp_slot_tickets) || 0;

  const before25 = Math.floor(points / 25);
  points += addPoints;
  const after25 = Math.floor(points / 25);
  const newSlots = after25 - before25;
  slotTickets += newSlots;

  cache[idx].stamp_points = points;
  cache[idx].stamp_slot_tickets = slotTickets;

  showToast('加算中...');
  await pushData(cache);

  document.getElementById('stamp-broc-'+id).value = '';
  document.getElementById('stamp-pen-'+id).value = '';
  document.getElementById('stamp-custom-emoji-'+id).value = '';
  document.getElementById('stamp-custom-point-'+id).value = '';
  document.getElementById('stamp-custom-count-'+id).value = '';
  renderAdmin();
  showToast('スタンプ' + addPoints + 'pt加算！' + (newSlots > 0 ? ' 🎰スロット権+' + newSlots : ''));
}

async function setStampPointsDirect(id) {
  await fetchData();
  const idx = cache.findIndex(p => String(p.id) === String(id));
  if (idx === -1) return;
  const newPoints = Math.max(0, Number(document.getElementById('stamp-direct-'+id).value) || 0);
  cache[idx].stamp_points = newPoints;
  showToast('修正中...');
  await pushData(cache);
  renderAdmin();
  showToast('ポイントを' + newPoints + 'ptに修正しました');
}

async function confiscateTickets(id, name) {
  if (!confirm(name + 'のチケットを没収しますか？')) return;
  await fetchData();
  const idx = cache.findIndex(p => String(p.id) === String(id));
  if (idx === -1) return;
  cache[idx].roulette_tickets = 0;
  cache[idx].roulette_progress = 0;
  showToast('没収中...');
  await pushData(cache);
  await fetchData(); // 最新データで再描画
  renderAdmin();
  showToast('没収しました');
}

async function deletePerson(id){
  if(!confirm('削除しますか？'))return;
  await fetchData();
  cache=cache.filter(p=>String(p.id)!==String(id));
  showToast('削除中...');await pushData(cache);renderAdmin();showToast('削除しました');
}

async function addPerson(){
  const name=document.getElementById('new-name').value.trim();
  const pw=document.getElementById('new-pw').value.trim();
  const amount=Number(document.getElementById('new-amount').value)||0;
  if(!name){showToast('名前を入力してください');return;}
  if(!pw){showToast('パスワードを入力してください');return;}

  showToast('確認中...');
  await fetchData(); // 最新データを取得してから重複チェック

  if(cache.find(p=>p.name===name)){showToast('同じ名前がすでにいます');return;}
  cache.push({id:Date.now().toString()+Math.random().toString(36).slice(2,6),name,password:pw,amount,roulette_progress:0,roulette_tickets:0,stamp_points:0,stamp_slot_tickets:0});
  showToast('追加中...');await pushData(cache);
  document.getElementById('new-name').value='';
  document.getElementById('new-pw').value='';
  document.getElementById('new-amount').value='';
  renderAdmin();showToast('追加しました！');
}
